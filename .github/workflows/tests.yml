name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Lancio i test
        run: mvn -B test

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-surefire
          path: target/surefire-reports
